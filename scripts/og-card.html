<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: linear-gradient(135deg, #FAF9F5 0%, #F7E8D9 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  .card {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 28px;
    padding: 0 100px;
  }
  .mark {
    width: 110px;
    height: 110px;
    display: block;
  }
  h1 {
    font-size: 64px;
    color: #1F1D1A;
    font-weight: 800;
    letter-spacing: -0.01em;
  }
  p {
    font-size: 30px;
    color: #6B6862;
    max-width: 820px;
    line-height: 1.4;
  }
</style>
</head>
<body>
  <div class="card">
    <img class="mark" src="../public/favicon.svg" alt="">
    <h1>Eldrid</h1>
    <p>Usikker på en melding? Spør Eldrid før du svarer.</p>
  </div>
</body>
</html>
